# /opt/etl_loader/config.yaml
data_dir: /opt/data
pg_url: postgresql+psycopg2://postgres:password@127.0.0.1:5432/bigdata
workers: 6
batch_size: 5000
use_copy: true
compute_hash: false
writer_batch_files: 8
writer_batch_timeout_sec: 1.0
queue_task_maxsize: 0
queue_meta_maxsize: 0
tmp_dir: /opt/etl_loader/tmp
monitor_host: 0.0.0.0
monitor_port: 8080
log_file: /opt/etl_loader/logs/etl.log
error_log: /opt/etl_loader/logs/errors.log
